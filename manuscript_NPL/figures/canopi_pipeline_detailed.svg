<svg viewBox="0 0 1160 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<title>CANOPI detailed architecture and training objective</title>
<desc>Inference pipeline from input through L0 canonicalization, frozen encoder, L1 CANOPI projection head, detector head, and thresholded decision; below it the four-term joint training objective that trains only the projection head.</desc>
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
<marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#15803d"/></marker>
</defs>

<text x="40" y="40" font-size="22" font-weight="700" fill="#0f172a">CANOPI — architecture &amp; training objective</text>
<text x="40" y="64" font-size="13.5" fill="#475569">Inference path: x → c(x) → frozen encoder → projection head P → detector head → decision.  No LLM at inference.</text>

<text x="40" y="104" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">INFERENCE</text>

<rect x="40" y="118" width="120" height="84" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="100" y="150" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Input x</text>
<text x="100" y="172" font-size="11" fill="#475569" text-anchor="middle">prompt / doc /</text>
<text x="100" y="186" font-size="11" fill="#475569" text-anchor="middle">tool output</text>
<line x1="160" y1="160" x2="196" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="198" y="110" width="232" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="314" y="134" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Stage 1 · Canonicalization c(x)</text>
<text x="314" y="153" font-size="10.5" fill="#1e40af" text-anchor="middle">NFKC · zero-width/Tag strip · UTS#39 fold</text>
<text x="314" y="168" font-size="10.5" fill="#1e40af" text-anchor="middle">base64/hex/URL/ROT13 unwrap (≤D) · hardened</text>
<rect x="214" y="178" width="200" height="22" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="314" y="193" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">CERTIFIED: invariant over C_D(x)</text>
<line x1="430" y1="160" x2="466" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="468" y="118" width="150" height="84" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="543" y="150" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Encoder E</text>
<text x="543" y="171" font-size="10.5" fill="#475569" text-anchor="middle">multilingual, FROZEN</text>
<text x="543" y="186" font-size="10.5" fill="#475569" text-anchor="middle">(no gradient)</text>
<line x1="618" y1="160" x2="654" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="656" y="110" width="178" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="745" y="134" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Stage 2 · CANOPI head P</text>
<text x="745" y="153" font-size="10.5" fill="#166534" text-anchor="middle">2-layer MLP · GELU</text>
<text x="745" y="168" font-size="10.5" fill="#166534" text-anchor="middle">→ L2-norm z ∈ ℝ¹²⁸</text>
<rect x="672" y="178" width="146" height="22" rx="11" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
<text x="745" y="193" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">TRAINABLE (only P)</text>
<line x1="834" y1="160" x2="870" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="872" y="118" width="150" height="84" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="947" y="148" font-size="14" font-weight="700" fill="#115e59" text-anchor="middle">Detector head</text>
<text x="947" y="168" font-size="10.5" fill="#0f766e" text-anchor="middle">Linear → σ → s(x)</text>
<text x="947" y="186" font-size="10.5" fill="#0f766e" text-anchor="middle">single neuron</text>
<line x1="1022" y1="160" x2="1058" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1060" y="126" width="80" height="68" rx="10" fill="#1e293b"/>
<text x="1100" y="153" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Decision</text>
<text x="1100" y="174" font-size="11" fill="#cbd5e1" text-anchor="middle">𝟙[s≥τ]</text>
<text x="1100" y="210" font-size="9.5" fill="#64748b" text-anchor="middle">τ @ 1% FPR (val)</text>

<line x1="745" y1="210" x2="745" y2="276" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arg)"/>
<text x="757" y="248" font-size="11" font-style="italic" fill="#15803d">backprop trains P</text>

<rect x="40" y="280" width="1100" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="60" y="308" font-size="14" font-weight="700" fill="#0f172a">JOINT TRAINING OBJECTIVE   L = λ₁·L_inv + λ₂·L_hardneg + λ₃·L_drift + λ₄·L_pAUC</text>
<text x="60" y="328" font-size="11.5" fill="#64748b">Frozen encoder; gradients flow only into P. Baselines are λ-toggles (B6 = invariance-only, B7 = pAUC-only). CANOPI must beat both.</text>

<rect x="60" y="344" width="528" height="166" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
<text x="76" y="366" font-size="12.5" font-weight="700" fill="#047857">IDEA 1 — same meaning → same place (intent-invariance)</text>

<rect x="76" y="378" width="240" height="116" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
<text x="196" y="400" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">L_inv  (λ₁)</text>
<text x="196" y="420" font-size="10.5" fill="#374151" text-anchor="middle">multi-view supervised contrastive</text>
<text x="196" y="436" font-size="10.5" fill="#374151" text-anchor="middle">pull clean / obfuscated / AR / ES</text>
<text x="196" y="452" font-size="10.5" fill="#374151" text-anchor="middle">views of one intent together</text>
<text x="196" y="476" font-size="10" fill="#6b7280" text-anchor="middle">cross-lingual recall w/o</text>
<text x="196" y="489" font-size="10" fill="#6b7280" text-anchor="middle">multilingual pretraining</text>

<rect x="332" y="378" width="240" height="116" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
<text x="452" y="400" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">L_drift  (λ₃)</text>
<text x="452" y="424" font-size="10.5" fill="#374151" text-anchor="middle">penalize ‖P(x) − P(view)‖</text>
<text x="452" y="440" font-size="10.5" fill="#374151" text-anchor="middle">across transform families</text>
<text x="452" y="470" font-size="10" fill="#6b7280" text-anchor="middle">explicit invariance</text>
<text x="452" y="483" font-size="10" fill="#6b7280" text-anchor="middle">regularizer</text>

<rect x="600" y="344" width="528" height="166" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<text x="616" y="366" font-size="12.5" font-weight="700" fill="#1d4ed8">IDEA 2 — excel exactly at the strict operating point</text>

<rect x="616" y="378" width="248" height="116" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="740" y="400" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">L_pAUC  (λ₄)</text>
<text x="740" y="424" font-size="10.5" fill="#374151" text-anchor="middle">partial-AUC top-push over</text>
<text x="740" y="440" font-size="10.5" fill="#374151" text-anchor="middle">FPR ∈ [0, β]; β ≈ 1%</text>
<text x="740" y="470" font-size="10" fill="#6b7280" text-anchor="middle">sharpen benign/attack gap</text>
<text x="740" y="483" font-size="10" fill="#6b7280" text-anchor="middle">at the deployed threshold</text>

<rect x="880" y="378" width="232" height="116" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="996" y="400" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">L_hardneg  (λ₂)</text>
<text x="996" y="424" font-size="10.5" fill="#374151" text-anchor="middle">push attacks away from</text>
<text x="996" y="440" font-size="10.5" fill="#374151" text-anchor="middle">benign that SHARE a trigger</text>
<text x="996" y="456" font-size="10.5" fill="#374151" text-anchor="middle">token (e.g. “ignore”)</text>
<text x="996" y="483" font-size="10" fill="#6b7280" text-anchor="middle">over-defense guard (NotInject)</text>

<text x="40" y="566" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">SCOPE TAXONOMY</text>
<rect x="40" y="578" width="352" height="118" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="216" y="602" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">Inside C_D — orthographic/encoding</text>
<text x="216" y="624" font-size="11" fill="#78350f" text-anchor="middle">deterministic CERTIFICATE</text>
<text x="216" y="642" font-size="11" fill="#78350f" text-anchor="middle">0 attack success, any detector</text>
<text x="216" y="666" font-size="10" fill="#a16207" text-anchor="middle">Path A · the theorem</text>

<rect x="404" y="578" width="352" height="118" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
<text x="580" y="602" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">Outside C_D — novel obfuscation</text>
<text x="580" y="624" font-size="11" fill="#14532d" text-anchor="middle">hardened canonicalizer +</text>
<text x="580" y="642" font-size="11" fill="#14532d" text-anchor="middle">invariance objective (EMPIRICAL)</text>
<text x="580" y="666" font-size="10" fill="#047857" text-anchor="middle">Path B · adaptive, held-out families</text>

<rect x="768" y="578" width="360" height="118" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
<text x="948" y="602" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">Semantic paraphrase</text>
<text x="948" y="624" font-size="11" fill="#7f1d1d" text-anchor="middle">canonicalization is a NO-OP</text>
<text x="948" y="642" font-size="11" fill="#7f1d1d" text-anchor="middle">out of scope (honest boundary)</text>
<text x="948" y="666" font-size="10" fill="#b91c1c" text-anchor="middle">Path C · representation space, future work</text>
</svg>
