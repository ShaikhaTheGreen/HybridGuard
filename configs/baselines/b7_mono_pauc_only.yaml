# b7_mono — pAUC-ONLY (lam1=lam2=lam3=0) on the MONOLINGUAL (English) encoder,
# with NO cross-lingual views. Attribution run: the operating-point term WITHOUT
# the invariance machinery. EXPECTED: does NOT recover the cross-lingual lift
# (no invariance views, no contrastive pull) -> confirms pAUC is not the source.
# Pair with b6_mono. If b6_mono lifts and b7_mono does not, the cross-lingual
# recovery is attributable to multi-view invariance, not the pAUC objective.
name: b7_mono_pauc_only
seeds: [42, 2025, 7, 1337, 314]
split: {scheme: "60/20/20", seed: 1337, stratified: true}
encoder:
  backend: sentence-transformers
  model_name: sentence-transformers/all-MiniLM-L6-v2     # monolingual (English)
  canonicalize_first: true
  cache: true
model: {head_depth: 2, hidden: 256, out_dim: 128, dropout: 0.1, freeze_encoder: true}
loss:  {lam1_inv: 0.0, lam2_hardneg: 0.0, lam3_drift: 0.0, lam4_pauc: 1.0, beta: 0.01, pauc_margin: 1.0}
augment: {families: [], crosslingual: [], intent_filter: false}   # no invariance views
train: {epochs: 30, batch_size: 256, lr: 0.001, wd: 0.0001}
eval:  {target_fpr: 0.01, bootstrap_resamples: 1000, bootstrap_seed: 1337}
